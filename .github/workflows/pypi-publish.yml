name: pypi-publish

# Publishes lv24-wifi-explorer to PyPI with Trusted Publishing (OIDC):
# no API token, no password and no PyPI secret. PyPI validates the calling
# GitHub workflow against the project's trusted publisher and issues a
# short-lived upload credential.
#
# Triggers:
#   - publishing a GitHub release (tag vX.Y.Z) publishes that version;
#   - manual dispatch with an explicit version (must match packages/cli,
#     packages/mcp, python/pyproject.toml and python __init__.py).
# If the version already exists on PyPI, the publish step is skipped.
#
# Release order: publish the npm packages with npm-publish.yml first, then run
# this workflow, so the launcher never points at npm versions that do not exist.
#
# Free for a public repository; no paid runners or services are used.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match both npm packages and python/pyproject.toml, e.g. 1.0.1)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          raw = (os.environ.get("RELEASE_TAG") or os.environ.get("INPUT_VERSION") or "").strip()
          version = raw[1:] if raw.startswith("v") else raw

          if not version:
              raise SystemExit("::error::No version provided (release tag or workflow input).")

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"::error::Invalid version '{version}'.")


          def npm_package(path, expected_name):
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError) as error:
                  raise SystemExit(f"::error::Could not read {path}: {error}")
              if data.get("name") != expected_name:
                  raise SystemExit(
                      f"::error::{path} must be named {expected_name}, found {data.get('name')!r}."
                  )
              return data.get("version")


          cli_version = npm_package("packages/cli/package.json", "@lv24/wifi-cli")
          mcp_version = npm_package("packages/mcp/package.json", "@lv24/wifi-mcp")

          try:
              with Path("python/pyproject.toml").open("rb") as handle:
                  pyproject = tomllib.load(handle)
              python_name = pyproject["project"]["name"]
              python_version = pyproject["project"]["version"]
          except (OSError, KeyError, tomllib.TOMLDecodeError) as error:
              raise SystemExit(f"::error::Could not read python/pyproject.toml: {error}")

          if python_name != "lv24-wifi-explorer":
              raise SystemExit(
                  f"::error::python/pyproject.toml must be named lv24-wifi-explorer, found {python_name!r}."
              )

          try:
              init_text = Path("python/src/lv24_wifi_explorer/__init__.py").read_text(encoding="utf-8")
          except OSError as error:
              raise SystemExit(f"::error::Could not read python __init__.py: {error}")
          match = re.search(r'^__version__[ ]*=[ ]*"([^"]+)"', init_text, re.MULTILINE)
          if not match:
              raise SystemExit("::error::Could not find __version__ in python/src/lv24_wifi_explorer/__init__.py")
          init_version = match.group(1)

          for path, found in (
              ("packages/cli/package.json", cli_version),
              ("packages/mcp/package.json", mcp_version),
              ("python/pyproject.toml", python_version),
              ("python/src/lv24_wifi_explorer/__init__.py", init_version),
          ):
              if found != version:
                  raise SystemExit(f"::error::Version '{version}' does not match {path} '{found}'.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")

          print(f"Resolved version: {version}")
          PY

      - name: Run launcher tests
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        working-directory: python
        run: python -m build

      - name: Validate distribution metadata
        run: twine check python/dist/*

      - name: Check whether the version is already published
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/lv24-wifi-explorer/{version}/json"
          request = urllib.request.Request(url, headers={"User-Agent": "lv24-wifi-explorer-pypi-publish"})

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              status = error.code

          if status == 200:
              print(f"::notice::lv24-wifi-explorer {version} is already on PyPI; skipping publish.")
              skip = "true"
          elif status == 404:
              print(f"lv24-wifi-explorer {version} is not on PyPI yet; publishing.")
              skip = "false"
          else:
              raise SystemExit(f"::error::Unexpected PyPI response status: {status}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={skip}\n")
          PY

      # Trusted Publishing: the action exchanges the GitHub OIDC token for a
      # short-lived PyPI upload credential. No password or API token is set.
      - name: Publish to PyPI
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
