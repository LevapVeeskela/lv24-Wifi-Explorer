# Dart / Flutter verify for packages/ and flutter/ (independent of Electron JS CI).
name: Flutter CI

# Zero-spend policy: no automatic CI on push/PR (private repo + hosted runners =
# paid minutes). Run manually from the Actions tab when needed.
on:
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          dart --version
          flutter --version

      - name: Analyze and test (packages + flutter/)
        run: bash .github/scripts/flutter-verify.sh
