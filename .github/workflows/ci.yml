# JS/TS verify for LV24 WiFi Explorer (Node 20+ / Yarn 1.22).
# Zero-spend policy: manual-only; no automatic push/PR runs on hosted runners.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Yarn 1.22
        run: npm install -g yarn@1.22.22

      - name: Install (frozen lockfile)
        run: yarn install --frozen-lockfile --non-interactive

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Tests (includes scan suite)
        run: yarn test

      - name: Legacy scan node:test suite
        run: yarn test:scan

      - name: OUI tests
        run: yarn test:oui

      - name: CLI smoke (demo provider)
        run: |
          yarn cli providers
          yarn cli scan --provider demo --format json > /tmp/lv24-demo.json
          test -s /tmp/lv24-demo.json

      - name: Renderer + desktop build
        run: yarn build
        env:
          # Intentionally no VITE_MUI_LICENSE_KEY — MUI license proof test skips without a local key.
          CI: true
