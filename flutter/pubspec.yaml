name: lv24_wifi_explorer
description: LV24 WiFi Explorer Flutter client (mobile + desktop) — demo workbench until live ScanCore adapters land.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.13.3

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  lv24_sunset_theme:
    path: ../packages/lv24_sunset_theme
  scan_l10n:
    path: ../packages/scan_l10n
  scan_domain:
    path: ../packages/scan_domain
  scan_core_client:
    path: ../packages/scan_core_client
  scan_oui:
    path: ../packages/scan_oui
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.1
  file_picker: ^8.1.7
  app_settings: ^6.1.1
  url_launcher: ^6.3.1
  printing: ^5.14.2
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/oui/registry.json
    - assets/fixtures/scan-snapshot.json
