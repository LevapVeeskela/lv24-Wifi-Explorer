app-id: by.lv24.wifi.explorer
runtime: org.freedesktop.Platform
runtime-version: '25.08' # TODO: must be the current Flathub branch at submission time
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08' # TODO: must match the runtime branch
command: lv24-wifi-explorer
separate-locales: false
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  # Only useful once the Linux provider talks to NetworkManager over D-Bus
  # instead of shelling out to nmcli (see README.md).
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: lv24-wifi-explorer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    build-commands:
      # TODO: replace with the real offline build:
